[package]
name = "sabikui-algs"
version = "0.0.0"
description = "A hash algorithm executable generator for sabikui"

repository.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
blake2 = "0.10.6"
ascon-hash = "0.3.1"
belt-hash = "0.1.1"
fsb = "0.1.3"
gost94 = "0.10.4"
groestl = "0.10.1"
jh = "0.1.0"
md2 = "0.10.2"
md4 = "0.10.2"
sha2 = "0.10.9"
sha3 = "0.10.8"
sm3 = "0.4.2"
whirlpool = "0.10.4"

# Ascon-Hash
[[bin]]
name = "ascon"
path = "src/bin/ascon.rs"

# Belt-Hash
[[bin]]
name = "belt"
path = "src/bin/belt.rs"

# Blake2 Family
[[bin]]
name = "blake2s256"
path = "src/bin/blake2/blake2s256.rs"

[[bin]]
name = "blake2b512"
path = "src/bin/blake2/blake2b512.rs"

# FSB Family
[[bin]]
name = "fsb-160"
path = "src/bin/fsb/fsb160.rs"

[[bin]]
name = "fsb-224"
path = "src/bin/fsb/fsb224.rs"

[[bin]]
name = "fsb-256"
path = "src/bin/fsb/fsb256.rs"

[[bin]]
name = "fsb-384"
path = "src/bin/fsb/fsb384.rs"

[[bin]]
name = "fsb-512"
path = "src/bin/fsb/fsb512.rs"

# GOST94
