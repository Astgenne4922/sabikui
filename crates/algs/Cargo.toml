[package]
name = "sabikui-algs"
version = "0.0.0"
description = "A hash algorithm executable generator for sabikui"

repository.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
sha2 = "0.10.9"
sha3 = "0.10.8"
sha1 = "0.10.6"
md-5 = "0.10.6"
blake2 = "0.10.6"
base16ct = { version = "0.3.0", features = ["alloc"] }

[[bin]]
name = "md5"
path = "src/bin/md5.rs"

[[bin]]
name = "sha1"
path = "src/bin/sha1.rs"

[[bin]]
name = "sha256"
path = "src/bin/sha256.rs"

[[bin]]
name = "sha512"
path = "src/bin/sha512.rs"

[[bin]]
name = "sha3-256"
path = "src/bin/sha3-256.rs"

[[bin]]
name = "sha3-512"
path = "src/bin/sha3-512.rs"

[[bin]]
name = "blake2b512"
path = "src/bin/blake2b512.rs"
