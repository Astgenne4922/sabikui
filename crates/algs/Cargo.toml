[package]
name = "sabikui-algs"
version = "0.0.0"
description = "A hash algorithm executable generator for sabikui"

repository.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
blake2 = "0.10.6"
ascon-hash = "0.3.1"
belt-hash = "0.1.1"
gost94 = "0.10.4"
md2 = "0.10.2"
md4 = "0.10.2"
sha2 = "0.10.9"
sha3 = "0.10.8"
sm3 = "0.4.2"
whirlpool = "0.10.4"

# Ascon-Hash
[[bin]]
name = "ascon"
path = "src/bin/ascon.rs"

# Belt-Hash
[[bin]]
name = "belt"
path = "src/bin/belt.rs"

# Blake2 Family
[[bin]]
name = "blake2s256"
path = "src/bin/blake2/blake2s256.rs"

[[bin]]
name = "blake2b512"
path = "src/bin/blake2/blake2b512.rs"


# GOST94
[[bin]]
name = "gost94"
path = "src/bin/gost94.rs"


# MD2
[[bin]]
name = "md2"
path = "src/bin/md2.rs"

# MD4
[[bin]]
name = "md4"
path = "src/bin/md4.rs"

# MD5
[[bin]]
name = "md5"
path = "src/bin/md5.rs"

# SHA1
[[bin]]
name = "sha1"
path = "src/bin/sha1.rs"

[[bin]]
name = "sha256"
path = "src/bin/sha256.rs"

[[bin]]
name = "sha512"
path = "src/bin/sha512.rs"

[[bin]]
name = "sha3-256"
path = "src/bin/sha3-256.rs"

[[bin]]
name = "sha3-512"
path = "src/bin/sha3-512.rs"

[[bin]]

# SM3
[[bin]]
name = "sm3"
path = "src/bin/sm3.rs"


# Whirlpool
[[bin]]
name = "whirlpool"
path = "src/bin/whirlpool.rs"
