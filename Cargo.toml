[package]
name = "sabikui"
version = "0.1.0"
homepage = "https://rust-analyzer.github.io/"
description = "A cli/gui modular application for hash calculation"

repository.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
eframe = "0.33.2"
egui = "0.33.2"
egui_extras = "0.33.2"
glob = "0.3.3"

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
repository = "https://github.com/Astgenne4922/sabikui"
authors = ["Astgenne4922"]

[workspace.dependencies]
base16ct = { version = "0.3.0", features = ["alloc"] }
