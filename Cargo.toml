[package]
name = "sabikui"
version = "0.1.0"
homepage = "https://github.com/Astgenne4922/sabikui"
description = "A cli/gui modular application for hash calculation"

repository.workspace = true
authors.workspace = true
edition.workspace = true

[lints.clippy]
correctness = "warn"
pedantic = "warn"
nursery = "warn"

[dependencies]
chrono = "0.4.42"
clap = { version = "4.5.53", features = ["derive"] }
eframe = "0.33.2"
egui = "0.33.2"
egui_extras = "0.33.2"
glob = "0.3.3"
rfd = "0.16.0"

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
repository = "https://github.com/Astgenne4922/sabikui"
authors = ["Astgenne4922"]
