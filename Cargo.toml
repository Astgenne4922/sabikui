[package]
name = "sabikui"
version = "0.1.0"
homepage = "https://github.com/Astgenne4922/sabikui"
description = "A cli/gui modular application for hash calculation"
license = "(MIT OR Apache-2.0) AND OFL-1.1"
include = ["LICENSE-APACHE", "LICENSE-MIT", "assets/*"]

repository.workspace = true
authors.workspace = true
edition.workspace = true

[package.metadata.i18n]
available-locales = ["en", "it"]

[lints.clippy]
correctness = "warn"
pedantic = "warn"
nursery = "warn"

[dependencies]
chrono = "0.4.42"
clap = { version = "4.5.53", features = ["derive"] }
dirs = "6.0.0"
eframe = "0.33.2"
egui = { version = "0.33.2", features = ["serde"] }
egui_dnd = "0.14.0"
egui_extras = "0.33.2"
glob = "0.3.3"
log = "0.4.29"
rfd = "0.16.0"
rust-i18n = "3.1.5"
serde = "1.0.228"
simplelog = "0.12.2"
sys-locale = "0.3.2"
toml = { version = "0.9.11", features = ["preserve_order"] }

[build-dependencies]
dirs = "6.0.0"

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
repository = "https://github.com/Astgenne4922/sabikui"
authors = ["Astgenne4922"]
